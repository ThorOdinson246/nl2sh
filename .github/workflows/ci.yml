name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    defaults:
      run:
        # Windows runners default to pwsh, where `> /dev/null` is a path.
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12"]
        include:
          # The README claims macOS support; prove it on the current version.
          - os: macos-latest
            python-version: "3.12"
          # Windows is unsupported but installable; the bar is "no traceback".
          # 3.9 catches POSIX-only calls that 3.13 has since gained.
          - os: windows-latest
            python-version: "3.9"
          - os: windows-latest
            python-version: "3.13"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install whatisit with dev extras
        working-directory: whatisit_pkg
        run: python -m pip install -e ".[dev]"

      - name: Lint with ruff
        working-directory: whatisit_pkg
        run: ruff check .

      - name: Run tests with coverage
        working-directory: whatisit_pkg
        run: pytest -q --cov=whatisit --cov-report=term-missing --cov-fail-under=58

      - name: Import cleanly and run as a module
        working-directory: whatisit_pkg
        run: |
          python -c "import whatisit, whatisit.cli, whatisit.engine, whatisit.safety"
          python -m whatisit --help > /dev/null

  nix:
    name: nix (flake builds)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v27

      # buildPythonApplication runs pytest inside the build, so this covers
      # both "the flake evaluates" and "the package works".
      - name: Build the flake
        run: nix build .#whatisit

      - name: Run the built binary
        run: ./result/bin/whatisit --help

  package:
    name: package (build, metadata, wheel + sdist install)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build tooling
        run: python -m pip install build twine

      - name: Build sdist and wheel
        working-directory: whatisit_pkg
        run: python -m build

      # PyPI rejects bad metadata at upload time, and a version number cannot
      # be reused once taken. Catch it here instead of burning a release.
      - name: Check distribution metadata
        working-directory: whatisit_pkg
        run: twine check --strict dist/*

      - name: Assert the wheel ships its licence files and one console script
        working-directory: whatisit_pkg
        run: |
          python - <<'PY'
          import glob, zipfile
          wheel = glob.glob("dist/*.whl")[0]
          names = zipfile.ZipFile(wheel).namelist()
          for required in ("LICENSE", "NOTICE"):
              assert any(n.endswith(f"licenses/{required}") for n in names), \
                  f"{required} missing from wheel: {names}"
          entry = next(n for n in names if n.endswith("entry_points.txt"))
          text = zipfile.ZipFile(wheel).read(entry).decode()
          assert "whatisit = whatisit.cli:main" in text, text
          # A second `nl2sh` script would collide with the unrelated PyPI
          # project of that name.
          assert "nl2sh =" not in text, text
          print("wheel contents OK")
          PY

      - name: Install the built wheel into a fresh venv
        run: |
          python -m venv /tmp/wheel-test
          /tmp/wheel-test/bin/pip install whatisit_pkg/dist/*.whl
          /tmp/wheel-test/bin/whatisit --help > /dev/null
          /tmp/wheel-test/bin/python -m whatisit --help > /dev/null

      # The sdist is what `pip install` falls back to when no wheel matches, so
      # it has to build and run on its own, not just ride along in the release.
      - name: Install the sdist into a fresh venv
        run: |
          python -m venv /tmp/sdist-test
          /tmp/sdist-test/bin/pip install whatisit_pkg/dist/*.tar.gz
          /tmp/sdist-test/bin/whatisit --help > /dev/null

      - name: Assert installed version matches the declared one
        run: |
          /tmp/wheel-test/bin/python - <<'PY'
          import importlib.metadata as md
          import whatisit
          dist = md.version("whatisit")
          assert dist == whatisit.__version__, (dist, whatisit.__version__)
          print("version OK:", dist)
          PY

      - name: "doctor exits 1 with no model installed, without crashing"
        run: |
          set +e
          out=$(/tmp/wheel-test/bin/whatisit doctor 2>&1)
          rc=$?
          set -e
          echo "$out"
          echo "doctor exit code: $rc"
          if [ "$rc" -ne 1 ]; then
            echo "expected doctor to exit 1 (not ready, no crash); got $rc" >&2
            exit 1
          fi
          case "$out" in
            *Traceback*) echo "doctor raised an exception" >&2; exit 1 ;;
          esac

      - name: "query with no model exits 3, without crashing"
        run: |
          set +e
          out=$(/tmp/wheel-test/bin/whatisit list files here 2>&1)
          rc=$?
          set -e
          echo "$out"
          if [ "$rc" -ne 3 ]; then
            echo "expected exit 3 (no model found); got $rc" >&2
            exit 1
          fi
          case "$out" in
            *Traceback*) echo "query raised an exception" >&2; exit 1 ;;
          esac
