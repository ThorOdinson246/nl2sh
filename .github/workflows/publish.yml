name: Publish to PyPI

# Publishes to PyPI when you bump the version and push to master, or when you
# publish a GitHub Release (either path works).
#
# One-time setup:
#   1. PyPI → API tokens → scope "whatisit" → copy token
#   2. GitHub → Settings → Secrets → Actions → PYPI_API_TOKEN
#
# Auto-publish flow (recommended):
#   1. Bump version in whatisit_pkg/pyproject.toml and
#      whatisit_pkg/whatisit/__init__.py (they must match)
#   2. git commit && git push origin master
#   → workflow detects the version bump, publishes, and creates tag vX.Y.Z
#      (skips tag creation if vX.Y.Z already exists on origin)

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - .github/workflows/publish.yml
      - whatisit_pkg/pyproject.toml
      - whatisit_pkg/whatisit/__init__.py
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: pypi-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Decide whether to publish
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.plan.outputs.publish }}
      version: ${{ steps.plan.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Plan publish
        id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail

          read_version() {
            python - <<'PY'
          import tomllib
          print(tomllib.load(open("whatisit_pkg/pyproject.toml", "rb"))["project"]["version"])
          PY
          }

          read_init_version() {
            python - <<'PY'
          import pathlib, re
          text = pathlib.Path("whatisit_pkg/whatisit/__init__.py").read_text(encoding="utf-8")
          match = re.search(r'__version__\s*=\s*["\']([^"\']+)["\']', text)
          if not match:
              raise SystemExit("Could not read __version__ from whatisit_pkg/whatisit/__init__.py")
          print(match.group(1))
          PY
          }

          CURRENT="$(read_version)"
          INIT="$(read_init_version)"

          if [ "$CURRENT" != "$INIT" ]; then
            echo "::error::pyproject.toml version ($CURRENT) != whatisit/__init__.py ($INIT)"
            exit 1
          fi

          echo "version=$CURRENT" >> "$GITHUB_OUTPUT"

          if [ "$EVENT_NAME" = "release" ]; then
            TAG_VERSION="${RELEASE_TAG#v}"
            if [ "$TAG_VERSION" != "$CURRENT" ]; then
              echo "::error::Release tag $RELEASE_TAG does not match package version $CURRENT"
              exit 1
            fi
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "Publishing from GitHub Release $RELEASE_TAG"
            exit 0
          fi

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            if curl -fsS "https://pypi.org/pypi/whatisit/$CURRENT/json" >/dev/null; then
              echo "Version $CURRENT already on PyPI; skipping publish"
              echo "publish=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Manual publish requested for version $CURRENT"
            echo "publish=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          PREVIOUS=""
          if git show HEAD~1:whatisit_pkg/pyproject.toml > /tmp/prev_pyproject.toml 2>/dev/null; then
            PREVIOUS="$(python - <<'PY'
          import tomllib
          print(tomllib.load(open("/tmp/prev_pyproject.toml", "rb"))["project"]["version"])
          PY
          )"
          fi

          if [ -z "$PREVIOUS" ]; then
            echo "No previous pyproject.toml on parent commit; skipping auto-publish"
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$PREVIOUS" = "$CURRENT" ]; then
            echo "Version unchanged ($CURRENT); skipping publish"
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if curl -fsS "https://pypi.org/pypi/whatisit/$CURRENT/json" >/dev/null; then
            echo "Version $CURRENT already on PyPI; skipping publish"
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Version bumped $PREVIOUS -> $CURRENT; will publish"
          echo "publish=true" >> "$GITHUB_OUTPUT"

  publish:
    name: Build and publish
    needs: prepare
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build package
        working-directory: whatisit_pkg
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Publish to PyPI
        id: pypi
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: whatisit_pkg/dist/
          password: ${{ secrets.PYPI_API_TOKEN }}
          skip_existing: true

      - name: Attach artifacts to GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: whatisit_pkg/dist/*

      - name: Ensure release tag exists
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          TAG="v${VERSION}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          tag_on_origin() {
            git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1
          }

          if tag_on_origin; then
            echo "Tag $TAG already exists on origin; nothing to do"
            exit 0
          fi

          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Local tag $TAG exists; pushing to origin"
          else
            git tag -a "$TAG" -m "Release $TAG"
          fi

          if git push origin "$TAG"; then
            echo "Pushed tag $TAG"
            exit 0
          fi

          # Tag may have been pushed manually between our check and push.
          if tag_on_origin; then
            echo "Tag $TAG exists on origin after push rejection; treating as success"
            exit 0
          fi

          echo "::error::Failed to create or push tag $TAG"
          exit 1

      - name: Verify PyPI release
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            if curl -fsS "https://pypi.org/pypi/whatisit/${VERSION}/json" >/dev/null; then
              echo "whatisit ${VERSION} is live on PyPI"
              exit 0
            fi
            echo "Waiting for PyPI index (attempt ${attempt}/5)..."
            sleep 5
          done
          echo "::error::whatisit ${VERSION} not found on PyPI after upload"
          exit 1

      - name: Publish summary
        if: always()
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          {
            echo "## PyPI publish"
            echo ""
            if [ "${{ steps.pypi.outcome }}" = "success" ]; then
              echo "- Uploaded **whatisit ${VERSION}** to PyPI"
              echo "- Install: \`pip install whatisit==${VERSION}\`"
            else
              echo "- PyPI upload step: **${{ steps.pypi.outcome }}**"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
