name: Bug report
description: Something in whatisit is broken or behaving unexpectedly
labels: ["bug"]
body:
  - type: checkboxes
    id: checks
    attributes:
      label: Before filing
      options:
        - label: I read the [README](https://github.com/ThorOdinson246/whatisit-nl2sh#readme)
          required: true
        - label: I searched open and closed issues for the same problem
          required: true
        - label: I ran `whatisit doctor` and included the output below
          required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What did you run, what did you expect, what did you get instead?
    validations:
      required: true
  - type: input
    id: command
    attributes:
      label: Exact whatisit invocation
      placeholder: whatisit -n 3 "find files bigger than 100MB"
  - type: textarea
    id: doctor
    attributes:
      label: Output of `whatisit doctor`
      render: shell
  - type: input
    id: version
    attributes:
      label: whatisit version / commit
      placeholder: 0.1.0
  - type: input
    id: platform
    attributes:
      label: OS / Python version
      placeholder: Ubuntu 22.04, Python 3.11
